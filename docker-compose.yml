# Local development / single-server stack.
# Production overrides live in docker-compose.production.yml.
#
#   docker compose up -d                 -> everything
#   docker compose up -d postgres redis minio mailpit   -> infra only
#   docker compose --profile monitoring up -d           -> + Prometheus/Grafana

name: picglot

x-api-env: &api-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DEBUG: ${DEBUG:-true}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-console}
  SECRET_KEY: ${SECRET_KEY:-dev-insecure-secret-key-change-me-in-production-0000000000000000}
  # Interpolated, not hardcoded: `environment:` overrides `env_file:`, so a
  # literal here silently wins over .env and every deployment gets the
  # development credentials no matter what it configured.
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://picglot:picglot@postgres:5432/picglot}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  QUEUE_BACKEND: ${QUEUE_BACKEND:-celery}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-picglot}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-picglot-dev-secret}
  S3_BUCKET: ${S3_BUCKET:-picglot}
  S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-true}"
  S3_USE_SSL: "${S3_USE_SSL:-false}"
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
  # mailpit only exists in the dev profile; production disables it, so a
  # hardcoded host here means mail silently goes nowhere.
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: "${SMTP_PORT:-1025}"
  SMTP_TLS: "${SMTP_TLS:-false}"
  PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
  PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
  OCR_PROVIDER_PRIORITY: ${OCR_PROVIDER_PRIORITY:-rapidocr,tesseract}
  TRANSLATION_PROVIDER_PRIORITY: ${TRANSLATION_PROVIDER_PRIORITY:-argos,deepl,google_translate,llm}
  LOCAL_ONLY_PROCESSING: ${LOCAL_ONLY_PROCESSING:-false}
  DEEPL_API_KEY: ${DEEPL_API_KEY:-}
  GOOGLE_TRANSLATE_API_KEY: ${GOOGLE_TRANSLATE_API_KEY:-}
  YANDEX_TRANSLATE_API_KEY: ${YANDEX_TRANSLATE_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
  YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SEED_ENABLED: ${SEED_ENABLED:-true}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@picglot.example}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Sup3r!Seed-2026}
  SEED_DEMO_EMAIL: ${SEED_DEMO_EMAIL:-demo@picglot.example}
  SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-Tr1al!Seed-2026}

x-worker-base: &worker-base
  build:
    context: .
    dockerfile: infra/docker/worker.Dockerfile
  restart: unless-stopped
  environment: *api-env
  volumes:
    - worker-tmp:/tmp/picglot
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: picglot
      POSTGRES_PASSWORD: picglot
      POSTGRES_DB: picglot
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picglot -d picglot"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-picglot}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-picglot-dev-secret}
      # The editor draws pages onto a canvas, which needs a CORS response even
      # though the objects themselves are private and reached only through
      # short-lived signed URLs. Narrow this to the site origin in production.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOW_ORIGIN:-*}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init/minio-init.sh"]
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-picglot}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-picglot-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-picglot}
    volumes:
      - ./infra/docker/minio-init.sh:/init/minio-init.sh:ro
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.22
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      <<: *api-env
      RUN_MIGRATIONS_ON_START: "true"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - worker-tmp:/tmp/picglot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    stop_grace_period: 30s

  worker-cpu:
    <<: *worker-base
    command: ["celery", "-A", "picglot.workers.celery_app", "worker", "-Q", "cpu", "-c", "2", "-l", "info", "--max-tasks-per-child", "40"]
    healthcheck:
      test: ["CMD", "celery", "-A", "picglot.workers.celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4g

  worker-export:
    <<: *worker-base
    command: ["celery", "-A", "picglot.workers.celery_app", "worker", "-Q", "export,notifications", "-c", "2", "-l", "info"]
    deploy:
      resources:
        limits:
          memory: 2g

  worker-beat:
    <<: *worker-base
    command: ["celery", "-A", "picglot.workers.celery_app", "beat", "-l", "info"]

  # GPU worker: enable with `docker compose --profile gpu up -d`
  worker-gpu:
    <<: *worker-base
    profiles: ["gpu"]
    command: ["celery", "-A", "picglot.workers.celery_app", "worker", "-Q", "gpu", "-c", "1", "-l", "info"]
    environment:
      <<: *api-env
      QUEUE_GPU_ENABLED: "true"
      ADVANCED_INPAINT_ENABLED: "true"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME:-PicGlot}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 40s

  clamav:
    image: clamav/clamav:1.4
    profiles: ["antivirus"]
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 300s

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:11.6.0
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/monitoring/grafana:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
  redis-data:
  minio-data:
  clamav-data:
  prometheus-data:
  grafana-data:
  worker-tmp:
