groups:
  - name: picglot-availability
    rules:
      - alert: ApiDown
        expr: up{component="api"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "API instance unreachable"
          runbook: docs/operations/incident-response.md

      - alert: WorkerOffline
        expr: picglot_worker_heartbeat_age_seconds > 180
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "No worker heartbeat for over 3 minutes"
          runbook: docs/operations/incident-response.md

      - alert: DatabaseUnavailable
        expr: picglot_db_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Database health check failing"

  - name: picglot-quality
    rules:
      - alert: HighJobErrorRate
        expr: |
          sum(rate(picglot_jobs_total{status="failed"}[10m]))
            / clamp_min(sum(rate(picglot_jobs_total[10m])), 0.001) > 0.15
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "More than 15% of jobs are failing"

      - alert: QueueBacklogGrowing
        expr: picglot_queue_depth > 200
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Queue depth above 200 — scale workers"
          runbook: docs/operations/scaling.md

      - alert: ProviderFailing
        expr: picglot_provider_circuit_open == 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "A provider circuit breaker is open"
          runbook: docs/operations/provider-outage.md

      - alert: ProviderCostLimitApproaching
        expr: picglot_provider_daily_cost_usd / clamp_min(picglot_provider_daily_cost_limit_usd, 0.01) > 0.8
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Provider spend above 80% of the daily cap"

  - name: picglot-business
    rules:
      - alert: PaymentWebhookFailures
        expr: increase(picglot_payment_webhook_failures_total[15m]) > 3
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Payment webhooks are failing verification or processing"

      - alert: OutboundWebhookFailures
        expr: increase(picglot_webhook_delivery_failures_total[30m]) > 20
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Customer webhook deliveries are failing"

      - alert: StorageNearCapacity
        expr: picglot_storage_used_bytes / clamp_min(picglot_storage_capacity_bytes, 1) > 0.85
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Object storage above 85% of capacity"
