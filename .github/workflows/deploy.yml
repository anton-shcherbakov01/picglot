name: Deploy

# Deployment is never triggered by a pull request. Staging follows main;
# production requires a manual approval through the GitHub environment.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Build and publish images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/worker.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/worker:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}/worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_S3_URL=${{ vars.NEXT_PUBLIC_S3_URL }}
          tags: |
            ghcr.io/${{ github.repository }}/web:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging:
    name: Deploy to staging
    needs: images
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Trigger staging rollout
        run: |
          curl -fsS -X POST "${{ secrets.STAGING_DEPLOY_HOOK }}" \
            -H 'Content-Type: application/json' \
            -d '{"tag":"${{ needs.images.outputs.tag }}"}'

      - name: Smoke test
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS "${{ vars.STAGING_URL }}/health/ready" > /dev/null; then
              echo "staging is ready"; exit 0
            fi
            sleep 10
          done
          echo "::error::staging did not become ready"; exit 1

  production:
    name: Deploy to production
    needs: [images, staging]
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    runs-on: ubuntu-latest
    # This environment must have required reviewers configured in GitHub —
    # that approval gate is what makes production deploys deliberate.
    environment: production
    steps:
      - name: Trigger production rollout
        run: |
          curl -fsS -X POST "${{ secrets.PRODUCTION_DEPLOY_HOOK }}" \
            -H 'Content-Type: application/json' \
            -d '{"tag":"${{ needs.images.outputs.tag }}"}'

      - name: Verify
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS "${{ vars.PRODUCTION_URL }}/health/ready" > /dev/null; then
              echo "production is ready"; exit 0
            fi
            sleep 10
          done
          echo "::error::production did not become ready — roll back"; exit 1
